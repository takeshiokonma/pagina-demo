<!DOCTYPE html>
<html>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, Initial-scale=1">
<img id="logo-header" src="https://www.uticvirtual.edu.py/pluginfile.php/1/theme_enlightlite/logo/1786031493/logo%20utic%20virtual%20.png">
<body>
<title>Distrito universitario UTIC</title>
<h1 class="header" id="header1">Página
<em>oficial</em>
de UTIC</h1>
<p class="bodytext">UTIC es una institución internacionalmente galardonada, reconocida por su educación de punta y eficacia en los metodos de enseñanza de ultima generación</p>
<img id="logo" src="https://www.utic.edu.py/v8/wp-content/uploads/2026/03/logo-UTIC-250x46.png">
<div class="magnet" id="magnetZone">
  <button class="magnet-button" id="magnetButton">Admira mi magnetismo</button>
</div>
<a href="https://www.utic.edu.py/v8/" id="link"> Página principal de UTIC </ah>

<style>
body {background-color: blue; justify-content: center; text-align: center; margin: 0 auto}
h1 {color: antiquewhite; font-size: 200px; font-style: bold; text-shadow: 2px 2px 2px black; -webkit-text-stroke: 2px pink;}

#link {color: antiquewhite; font-size: 100px; font-style: bold;}

#logo {height: 60px; display: block; margin: 30px auto;}

em {color: #FFC0CB; text-shadow: 3px 3px 3px black; -webkit-text-stroke: 4px pink}

.bodytext {display: block; text-align: 0; color: antiquewhite; font-size: 100px; border-width: 40px; border-radius: 40%; border-color: pink; text-shadow: 2px 2px 2px #FF7373; font-style: italic; max-width: 52ch}

#logo-header {display: block; width: 200px; margin-left: 50px; margin-top: 20px;}

.magnet-button { transition: transform 0.12s ease-out, box-shadow 0.12s ease-out }

.magnet { width: 400px; height: 200px; background-color: antiquewhite; border-radius: 20px; border-width: 20px; border-color: pink; margin: 0 auto; }

#magnetButton { width: 200px; height: 50px; margin: auto 0; margin-top: 70px; border-radius: 40px; font-style: italic; font-size: 17px; }

</style>

<script>
const magnetZone = document.getElementById("magnetZone")
const magnetButton = document.getElementById("magnetButton")

magnetZone.addEventListener('mousemove', (e) => {
  const r = magnetButton.getBoundingClientRect();
  const cx = r.left + r.width / 2;
  const cy = r.top + r.height / 2;
  const dx = e.clientX - cx;
  const dy = e.clientY - cy;
  const dist = Math.hypot(dx, dy);
  const pull = Math.max(0, 1 - dist / 140);
  magnetButton.style.transform = `translate(${dx * pull * 0.4}px, ${dy * pull * 0.4}px)`;
});

magnetZone.addEventListener('mouseleave', () => {
  magnetButton.style.transform = 'translate(0,0)';
});
</script>



</html>
